<section id="rawat" class="section section--lead">
<div class="wrap">
<h2 class="serif" style="margin: 0 0 6px; font-size: 30px; font-weight: 700">Kapan sebaiknya disiram?</h2>
<p class="muted" style="margin: 0 0 22px; font-size: 15.5px">Untuk fase berbunga: 300 ml per polibag, siram ke pangkal batang. Cek dulu — masukkan jari 2 ruas ke tanah, siram jika terasa kering.</p>

<div style="font-weight: 700; font-size: 19px; margin: 14px 0 2px">Pagi · 06.00–08.00</div>
<p class="muted" style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.6">Air terserap sebelum panas, daun cepat kering sehingga jamur tidak mudah tumbuh.</p>
</div>
<div class="card" style="padding: 24px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="color: var(--color-sun); display: flex"><i data-lucide="sunrise" width="30" height="30" stroke-width="1.6" aria-hidden="true"></i></span><span class="tag tag-siram">Bila tanah kering</span></div>
<div style="font-weight: 700; font-size: 19px; margin: 14px 0 2px">Sore · 16.00–17.30</div>
<p class="muted" style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.6">Siram tambahan di hari terik. Selesaikan sebelum gelap dan jangan basahi daun.</p>
</div>
<div class="card" style="padding: 24px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="color: var(--color-danger-text); display: flex"><i data-lucide="triangle-alert" width="28" height="28" stroke-width="1.6" aria-hidden="true"></i></span><span class="tag" style="background: var(--color-danger-soft); color: var(--color-danger-text)">Hindari</span></div>
<div style="font-weight: 700; font-size: 19px; margin: 14px 0 2px">Siang · 10.00–15.00</div>
<p class="muted" style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.6">Air cepat menguap, dan tetes di daun saat terik bisa memicu bunga rontok.</p>

<div style="padding: 16px 18px; border-radius: 16px; background: var(--color-white); border: 1px solid var(--color-border); display: flex; gap: 12px; align-items: center"><span style="color: var(--color-primary); display: flex"><i data-lucide="plant-pot" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div><div class="muted" style="font-size: 13px">Media tanam</div><div style="font-weight: 700">Tanah : kandang : sekam 2:1:1</div></div></div>

<div><h2 class="serif" style="margin: 0 0 6px; font-size: 30px; font-weight: 700">Hama &amp; penyakit yang perlu diwaspadai</h2><p class="muted" style="margin: 0; font-size: 15.5px">Periksa bagian bawah daun dua kali seminggu.</p></div>

<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: var(--color-danger-soft); color: var(--color-danger-text); display: flex; align-items: center; justify-content: center"><i data-lucide="bug" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Thrips</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: var(--color-text)">Ciri:</strong> daun keriting ke atas, ada bercak keperakan.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> perangkap kuning, semprot pestisida nabati sore hari.</p></div>
<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: var(--color-danger-soft); color: var(--color-danger-text); display: flex; align-items: center; justify-content: center"><i data-lucide="bug" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Kutu kebul</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: var(--color-text)">Ciri:</strong> serangga putih kecil terbang saat daun disentuh, daun menguning.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> perangkap kuning, cabut tanaman yang terkena virus kuning.</p></div>
<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: var(--color-danger-soft); color: var(--color-danger-text); display: flex; align-items: center; justify-content: center"><i data-lucide="bug" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Lalat buah</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: var(--color-text)">Ciri:</strong> buah berlubang kecil, lalu busuk dan rontok.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> pasang perangkap atraktan, kubur buah yang jatuh.</p></div>
<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: var(--color-danger-soft); color: var(--color-danger-text); display: flex; align-items: center; justify-content: center"><i data-lucide="leaf" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Antraknosa (patek)</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: var(--color-text)">Ciri:</strong> bercak cekung cokelat-hitam pada buah.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> buang buah sakit, jaga jarak tanam, hindari daun basah.</p></div>

<section id="tips" class="section section--compact">
<div class="wrap">
<div style="padding: 32px; border-radius: 24px; background: var(--color-accent-soft); border: 1px solid var(--color-accent-light); display: flex; flex-wrap: wrap; gap: 28px">
<div style="flex: 1 1 280px">
<div class="eyebrow" style="color: var(--color-fertilizer-text); display: flex; gap: 8px; align-items: center"><i data-lucide="sparkles" width="16" height="16" stroke-width="1.8" aria-hidden="true"></i>Tips hasil maksimal</div>
<h2 class="serif" style="margin: 10px 0 8px; font-size: 28px; font-weight: 700; line-height: 1.2">Jaga bunga supaya tidak rontok</h2>
<p style="margin: 0; font-size: 15.5px; line-height: 1.6; color: var(--color-text)">Cabai sedang berbunga. Jangan siram di atas daun pada siang hari dan kurangi nitrogen, ganti dengan kalium agar bunga tidak rontok.</p>
</div>
<ul style="flex: 1 1 420px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex; gap: 12px; padding: 14px 16px; background: var(--color-white); border-radius: 14px; font-size: 15px; line-height: 1.5"><span style="color: var(--color-primary); display: flex; flex: none"><i data-lucide="check" width="20" height="20" stroke-width="2.2" aria-hidden="true"></i></span>Pasang ajir sebelum buah lebat agar batang tidak patah.</li>
<li style="display: flex; gap: 12px; padding: 14px 16px; background: var(--color-white); border-radius: 14px; font-size: 15px; line-height: 1.5"><span style="color: var(--color-primary); display: flex; flex: none"><i data-lucide="check" width="20" height="20" stroke-width="2.2" aria-hidden="true"></i></span>Buang tunas di bawah cabang utama (tunas air) agar nutrisi ke bunga.</li>
<li style="display: flex; gap: 12px; padding: 14px 16px; background: var(--color-white); border-radius: 14px; font-size: 15px; line-height: 1.5"><span style="color: var(--color-primary); display: flex; flex: none"><i data-lucide="check" width="20" height="20" stroke-width="2.2" aria-hidden="true"></i></span>Mulsa jerami tipis di permukaan polibag menjaga tanah tetap lembap.</li>
<li style="display: flex; gap: 12px; padding: 14px 16px; background: var(--color-white); border-radius: 14px; font-size: 15px; line-height: 1.5"><span style="color: var(--color-primary); display: flex; flex: none"><i data-lucide="check" width="20" height="20" stroke-width="2.2" aria-hidden="true"></i></span>Saat musim hujan, pindahkan polibag ke tempat yang airnya tidak menggenang.</li>
</ul>
</div>
</div>
