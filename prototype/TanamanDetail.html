<section id="rawat" style="padding: 48px 0 24px">
<div class="wrap">
<h2 class="serif" style="margin: 0 0 6px; font-size: 30px; font-weight: 700">Kapan sebaiknya disiram?</h2>
<p class="muted" style="margin: 0 0 22px; font-size: 15.5px">Untuk fase berbunga: 300 ml per polibag, siram ke pangkal batang. Cek dulu — masukkan jari 2 ruas ke tanah, siram jika terasa kering.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div class="card" style="padding: 24px; border: 2px solid #2E7D32">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="color: #D97706; display: flex"><i data-lucide="sun" width="30" height="30" stroke-width="1.6" aria-hidden="true"></i></span><span class="tag" style="background: #2E7D32; color: #fff">Terbaik</span></div>
<div style="font-weight: 700; font-size: 19px; margin: 14px 0 2px">Pagi · 06.00–08.00</div>
<p class="muted" style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.6">Air terserap sebelum panas, daun cepat kering sehingga jamur tidak mudah tumbuh.</p>
</div>
<div class="card" style="padding: 24px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="color: #D97706; display: flex"><i data-lucide="sunrise" width="30" height="30" stroke-width="1.6" aria-hidden="true"></i></span><span class="tag tag-siram">Bila tanah kering</span></div>
<div style="font-weight: 700; font-size: 19px; margin: 14px 0 2px">Sore · 16.00–17.30</div>
<p class="muted" style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.6">Siram tambahan di hari terik. Selesaikan sebelum gelap dan jangan basahi daun.</p>
</div>
<div class="card" style="padding: 24px">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="color: #B91C1C; display: flex"><i data-lucide="triangle-alert" width="28" height="28" stroke-width="1.6" aria-hidden="true"></i></span><span class="tag" style="background: #FEE2E2; color: #B91C1C">Hindari</span></div>
<div style="font-weight: 700; font-size: 19px; margin: 14px 0 2px">Siang · 10.00–15.00</div>
<p class="muted" style="margin: 6px 0 0; font-size: 14.5px; line-height: 1.6">Air cepat menguap, dan tetes di daun saat terik bisa memicu bunga rontok.</p>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px">
<div style="padding: 16px 18px; border-radius: 16px; background: #fff; border: 1px solid #DCE5DE; display: flex; gap: 12px; align-items: center"><span style="color: #D97706; display: flex"><i data-lucide="sun" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div><div class="muted" style="font-size: 13px">Sinar matahari</div><div style="font-weight: 700">Penuh, 6–8 jam</div></div></div>
<div style="padding: 16px 18px; border-radius: 16px; background: #fff; border: 1px solid #DCE5DE; display: flex; gap: 12px; align-items: center"><span style="color: #2E7D32; display: flex"><i data-lucide="plant-pot" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div><div class="muted" style="font-size: 13px">Media tanam</div><div style="font-weight: 700">Tanah : kandang : sekam 2:1:1</div></div></div>
<div style="padding: 16px 18px; border-radius: 16px; background: #fff; border: 1px solid #DCE5DE; display: flex; gap: 12px; align-items: center"><span style="color: #0369A1; display: flex"><i data-lucide="droplet" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div><div class="muted" style="font-size: 13px">Air per hari</div><div style="font-weight: 700">± 300 ml / polibag</div></div></div>
<div style="padding: 16px 18px; border-radius: 16px; background: #fff; border: 1px solid #DCE5DE; display: flex; gap: 12px; align-items: center"><span style="color: #2E7D32; display: flex"><i data-lucide="flask-conical" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div><div class="muted" style="font-size: 13px">pH tanah</div><div style="font-weight: 700">6,0–7,0</div></div></div>

<section id="pupuk" style="padding: 40px 0 24px">
<div class="wrap">
<h2 class="serif" style="margin: 0 0 6px; font-size: 30px; font-weight: 700">Pupuk apa di tiap fase?</h2>
<p class="muted" style="margin: 0 0 22px; font-size: 15.5px">Takaran di bawah adalah panduan umum. Selalu cocokkan dengan dosis pada label kemasan.</p>
<div class="card" style="overflow-x: auto; padding: 0">
<table style="width: 100%; min-width: 760px; border-collapse: collapse; font-size: 15px">
<thead><tr style="background: #EDF3EF; text-align: left"><th style="padding: 14px 20px; font-weight: 700">Fase</th><th style="padding: 14px 20px; font-weight: 700">Jenis pupuk</th><th style="padding: 14px 20px; font-weight: 700">Cara &amp; takaran</th><th style="padding: 14px 20px; font-weight: 700">Frekuensi</th></tr></thead>
<tbody>
<tr style="border-top: 1px solid #EDF3EF"><td style="padding: 16px 20px; font-weight: 600">Persiapan tanam</td><td style="padding: 16px 20px">Pupuk kandang matang</td><td style="padding: 16px 20px" class="muted">Campur ke media, ±⅓ isi polibag</td><td style="padding: 16px 20px">Sekali</td></tr>
<tr style="border-top: 1px solid #EDF3EF"><td style="padding: 16px 20px; font-weight: 600">Vegetatif</td><td style="padding: 16px 20px">NPK seimbang (mis. 16-16-16)</td><td style="padding: 16px 20px" class="muted">Larutkan, kocor 200 ml per polibag</td><td style="padding: 16px 20px">Tiap 7 hari</td></tr>
<tr style="border-top: 1px solid #EDF3EF; background: #FFF8E1"><td style="padding: 16px 20px; font-weight: 700">Berbunga <span class="tag" style="background: #FFA000; color: #132A17; margin-left: 6px">Sekarang</span></td><td style="padding: 16px 20px; font-weight: 600">Tinggi fosfor &amp; kalium, kurangi nitrogen</td><td style="padding: 16px 20px" class="muted">Kocor ke pangkal batang, jangan kena bunga</td><td style="padding: 16px 20px">Tiap 7 hari</td></tr>
<tr style="border-top: 1px solid #EDF3EF"><td style="padding: 16px 20px; font-weight: 600">Berbuah</td><td style="padding: 16px 20px">Kalium + kalsium</td><td style="padding: 16px 20px" class="muted">Kocor; tambah kalsium bila ujung buah menghitam</td><td style="padding: 16px 20px">Tiap 7–10 hari</td></tr>
<tr style="border-top: 1px solid #EDF3EF"><td style="padding: 16px 20px; font-weight: 600">Panen</td><td style="padding: 16px 20px">Pupuk organik cair (POC)</td><td style="padding: 16px 20px" class="muted">Dosis ringan untuk menjaga tanaman tetap berbuah</td><td style="padding: 16px 20px">Tiap 14 hari</td></tr>
</tbody>

<section id="hama" style="padding: 40px 0 24px">
<div class="wrap">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px; margin-bottom: 22px">
<div><h2 class="serif" style="margin: 0 0 6px; font-size: 30px; font-weight: 700">Hama &amp; penyakit yang perlu diwaspadai</h2><p class="muted" style="margin: 0; font-size: 15.5px">Periksa bagian bawah daun dua kali seminggu.</p></div>
<a class="link" href="PanduanDetail.html">Panduan kenali hama dari daun →</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FEE2E2; color: #B91C1C; display: flex; align-items: center; justify-content: center"><i data-lucide="bug" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Thrips</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: #132A17">Ciri:</strong> daun keriting ke atas, ada bercak keperakan.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> perangkap kuning, semprot pestisida nabati sore hari.</p></div>
<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FEE2E2; color: #B91C1C; display: flex; align-items: center; justify-content: center"><i data-lucide="bug" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Kutu kebul</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: #132A17">Ciri:</strong> serangga putih kecil terbang saat daun disentuh, daun menguning.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> perangkap kuning, cabut tanaman yang terkena virus kuning.</p></div>
<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FEE2E2; color: #B91C1C; display: flex; align-items: center; justify-content: center"><i data-lucide="bug" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Lalat buah</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: #132A17">Ciri:</strong> buah berlubang kecil, lalu busuk dan rontok.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> pasang perangkap atraktan, kubur buah yang jatuh.</p></div>
<div class="card" style="padding: 22px"><span style="width: 44px; height: 44px; border-radius: 12px; background: #FEE2E2; color: #B91C1C; display: flex; align-items: center; justify-content: center"><i data-lucide="leaf" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></span><div style="font-weight: 700; font-size: 17px; margin: 14px 0 4px">Antraknosa (patek)</div><p class="muted" style="margin: 0 0 12px; font-size: 14px; line-height: 1.55"><strong style="color: #132A17">Ciri:</strong> bercak cekung cokelat-hitam pada buah.</p><p style="margin: 0; font-size: 14px; line-height: 1.55"><strong>Atasi:</strong> buang buah sakit, jaga jarak tanam, hindari daun basah.</p></div>
</div>

<section id="tips" style="padding: 40px 0 24px">
<div class="wrap">
<div style="padding: 32px; border-radius: 24px; background: #FFF8E1; border: 1px solid #FFE7A8; display: flex; flex-wrap: wrap; gap: 28px">
<div style="flex: 1 1 280px">
<div class="eyebrow" style="color: #92400E; display: flex; gap: 8px; align-items: center"><i data-lucide="sparkles" width="16" height="16" stroke-width="1.8" aria-hidden="true"></i>Tips hasil maksimal</div>
<h2 class="serif" style="margin: 10px 0 8px; font-size: 28px; font-weight: 700; line-height: 1.2">Jaga bunga supaya tidak rontok</h2>
<p style="margin: 0; font-size: 15.5px; line-height: 1.6; color: #132A17">Cabai sedang berbunga. Jangan siram di atas daun pada siang hari dan kurangi nitrogen, ganti dengan kalium agar bunga tidak rontok.</p>
</div>
<ul style="flex: 1 1 420px; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<li style="display: flex; gap: 12px; padding: 14px 16px; background: #fff; border-radius: 14px; font-size: 15px; line-height: 1.5"><span style="color: #2E7D32; display: flex; flex: none"><i data-lucide="check" width="20" height="20" stroke-width="2.2" aria-hidden="true"></i></span>Pasang ajir sebelum buah lebat agar batang tidak patah.</li>
