<h1 class="serif article-title" style="margin: 14px 0; font-weight: 700">Musim hujan datang: siapkan drainase bedengan sebelum akar busuk</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: var(--color-text-body)">Genangan yang bertahan lama membuat akar kekurangan udara. Dengan sedikit persiapan, kebun pekarangan tetap aman sepanjang musim hujan.</p>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--color-border)">

<div class="prose" style="max-width: 820px; margin: 0 auto; padding: 40px 24px 24px; font-size: 18px; line-height: 1.8; color: var(--color-text)">
<p style="margin: 0 0 20px">Hujan yang turun hampir setiap sore memang menghemat air siraman. Tapi bagi cabai, tomat, dan terong, tanah yang terus jenuh air adalah masalah: akar butuh udara, dan genangan menutup pori-pori tanah.</p>
<h2 class="serif" style="margin: 36px 0 12px; font-size: 28px; font-weight: 700; color: var(--color-text)">1. Tinggikan bedengan</h2>
<p style="margin: 0 0 20px">Bedengan setinggi 20–30 cm membuat zona akar berada di atas permukaan air. Lebarnya cukup 1 meter agar mudah dirawat dari kedua sisi.</p>
<h2 class="serif" style="margin: 36px 0 12px; font-size: 28px; font-weight: 700; color: var(--color-text)">2. Buat parit di antara bedengan</h2>
<p style="margin: 0 0 20px">Parit kecil sedalam 20 cm mengalirkan air ke saluran pembuangan. Pastikan ujungnya sedikit lebih rendah supaya air tidak berhenti di tengah.</p>
<blockquote style="margin: 28px 0; padding: 22px 26px; border-radius: 18px; background: var(--color-accent-soft); color: var(--color-text); font-size: 18px; line-height: 1.65">
<div class="eyebrow" style="color: var(--color-fertilizer-text); margin-bottom: 8px">Tips penyuluh</div>
Taburkan sekam bakar di permukaan bedengan. Selain menahan percikan tanah ke daun, sekam membantu tanah tetap gembur setelah hujan deras.
</blockquote>
<h2 class="serif" style="margin: 36px 0 12px; font-size: 28px; font-weight: 700; color: var(--color-text)">3. Amankan polibag</h2>
<ul style="margin: 0 0 20px; padding-left: 22px; display: flex; flex-direction: column; gap: 8px">
<li>Pastikan setiap polibag punya lubang di bagian bawah dan samping.</li>
<li>Letakkan di atas batu bata atau papan agar tidak berdiri di genangan.</li>
<li>Kurangi siram manual — TaniPintar otomatis melewati jadwal siram saat hujan.</li>
</ul>
<h2 class="serif" style="margin: 36px 0 12px; font-size: 28px; font-weight: 700; color: var(--color-text)">4. Waspadai jamur</h2>
<p style="margin: 0 0 20px">Kelembapan tinggi memicu penyakit seperti antraknosa pada cabai dan busuk daun pada tomat. Pangkas daun bawah yang menyentuh tanah dan beri jarak antar tanaman agar udara mengalir.</p>
