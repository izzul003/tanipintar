        todo: ['Siram pagi ± 350 ml per polibag, tambah sore saat terik', 'Fase daun: NPK seimbang tiap 7 hari', 'Saat berbunga: beralih ke pupuk tinggi kalium', 'Tambahkan kalsium bila ujung buah menghitam'],
        tip: 'Siram teratur lebih penting dari banyaknya air — kering-basah bergantian bisa membuat buah pecah.' },
      { img: 'images/tutorial-6-panen.jpg', title: 'Panen', when: 'Hari ± 65–75', body: 'Buah dipetik saat warnanya merata. Tomat cherry berbuah bertahap, jadi panen bisa berlangsung beberapa minggu.',
        todo: ['Petik saat warna merah merata dan buah masih padat', 'Panen di pagi hari', 'Petik bersama tangkainya agar lebih awet', 'Cek tanaman tiap 2–3 hari'],
        tip: 'Buah yang dipetik saat mulai berwarna akan matang sendiri di suhu ruang.' }
    ];
    const i = this.state.i;
    const steps = data.map((s, k) => ({
      n: k + 1, title: s.title, when: s.when, cur: k === i ? 'step' : 'false',
      style: k === i ? 'background:#1B5E20;color:#fff;border-color:#1B5E20' : (k < i ? 'background:#E8F5E9;color:#132A17' : 'background:#fff;color:#132A17'),
      numStyle: k === i ? 'background:#FFA000;color:#132A17' : (k < i ? 'background:#2E7D32;color:#fff' : 'background:#EDF3EF;color:#3E5643'),
      pick: () => this.setState({ i: k })
    }));
    const cur = Object.assign({ n: i + 1 }, data[i]);
    return { steps, cur,
      prev: () => this.setState({ i: Math.max(0, i - 1) }),
      next: () => this.setState({ i: Math.min(data.length - 1, i + 1) }) };
  }
}
