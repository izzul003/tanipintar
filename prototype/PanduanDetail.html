<h2 id="pagi" class="serif" style="margin: 40px 0 10px; font-size: 28px; font-weight: 700; color: #132A17">Kenapa pagi terbaik</h2>
<p style="margin: 0 0 14px">Di pagi hari suhu masih rendah, jadi air sempat meresap ke zona akar sebelum menguap. Daun yang terkena percikan juga cepat kering begitu matahari naik, sehingga jamur tidak sempat berkembang.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<div style="padding: 18px; border-radius: 16px; background: #E0F2FE"><div style="color: #0369A1; display: flex"><i data-lucide="droplet" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></div><div style="font-weight: 700; margin-top: 8px; color: #132A17">Lebih sedikit menguap</div><div style="font-size: 14px; color: #3E5643; line-height: 1.5">Air lebih banyak sampai ke akar.</div></div>
<div style="padding: 18px; border-radius: 16px; background: #E8F5E9"><div style="color: #2E7D32; display: flex"><i data-lucide="leaf" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></div><div style="font-weight: 700; margin-top: 8px; color: #132A17">Daun cepat kering</div><div style="font-size: 14px; color: #3E5643; line-height: 1.5">Risiko jamur dan busuk daun turun.</div></div>
<div style="padding: 18px; border-radius: 16px; background: #FFF8E1"><div style="color: #D97706; display: flex"><i data-lucide="sun" width="22" height="22" stroke-width="1.8" aria-hidden="true"></i></div><div style="font-weight: 700; margin-top: 8px; color: #132A17">Siap hadapi terik</div><div style="font-size: 14px; color: #3E5643; line-height: 1.5">Tanaman punya cadangan air di siang hari.</div></div>
</div>

<h2 id="sore" class="serif" style="margin: 40px 0 10px; font-size: 28px; font-weight: 700; color: #132A17">Kapan boleh sore</h2>
<p style="margin: 0 0 14px">Siram sore berguna di hari sangat panas atau untuk media kecil seperti pot dan polibag yang cepat kering. Selesaikan sebelum pukul 17.30 dan siram ke tanah, bukan ke daun — daun yang basah semalaman mudah terserang jamur.</p>
<div style="padding: 16px 18px; border-radius: 14px; background: #E0F2FE; color: #0369A1; display: flex; gap: 12px; font-size: 15px; line-height: 1.55"><span style="display: flex; flex: none"><i data-lucide="bell" width="20" height="20" stroke-width="1.8" aria-hidden="true"></i></span><span>TaniPintar otomatis melewati siram sore bila prakiraan hujan di lokasimu tinggi.</span></div>

<tbody>
<tr style="border-top: 1px solid #EDF3EF"><td style="padding: 14px 18px; font-weight: 600">Sayur buah (cabai, tomat, terong)</td><td style="padding: 14px 18px">Pagi, sore bila kering</td><td style="padding: 14px 18px" class="muted">Ke pangkal batang; jangan basahi bunga</td></tr>
<tr style="border-top: 1px solid #EDF3EF"><td style="padding: 14px 18px; font-weight: 600">Sayur daun (selada, pakcoy, bayam)</td><td style="padding: 14px 18px">Pagi dan sore</td><td style="padding: 14px 18px" class="muted">Media dangkal cepat kering; hindari daun basah malam hari</td></tr>

<tr style="border-top: 1px solid #EDF3EF"><td style="padding: 14px 18px; font-weight: 600">Rempah (kemangi, daun bawang)</td><td style="padding: 14px 18px">Pagi</td><td style="padding: 14px 18px" class="muted">Biarkan permukaan agak kering di antara siraman</td></tr>

<h2 id="cek" class="serif" style="margin: 40px 0 10px; font-size: 28px; font-weight: 700; color: #132A17">Cek perlu siram atau tidak</h2>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px">
<li><strong>Tes jari:</strong> masukkan jari sedalam 2 ruas ke media. Kering? Siram. Masih lembap? Tunda.</li>
<li><strong>Angkat polibag:</strong> polibag yang ringan berarti medianya sudah kering.</li>
<li><strong>Lihat daun pagi hari:</strong> daun layu di pagi hari tanda kurang air; layu di siang lalu segar sore itu normal.</li>
</ol>

<div style="padding: 14px 18px; border-radius: 14px; background: #FEE2E2; color: #7F1D1D; display: flex; gap: 12px; font-size: 15px"><span style="display: flex; flex: none"><i data-lucide="triangle-alert" width="20" height="20" stroke-width="1.8" aria-hidden="true"></i></span>Menyiram di malam hari ke daun — memicu jamur dan busuk.</div>
